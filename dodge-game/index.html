<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문서 인코딩을 UTF-8로 지정합니다. -->
  <meta charset="UTF-8" />
  <!-- 브라우저 탭에 표시되는 페이지 제목입니다. -->
  <title>블록 피하기</title>
  <style>
    /* 페이지 전체의 여백, 배경색, 글자색과 정렬을 설정합니다. */
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    /* 게임 제목 주위의 여백을 설정합니다. */
    h1 {
      margin: 20px 0 10px;
    }

    /* 실제 게임이 그려지는 캔버스의 색상과 테두리를 설정합니다. */
    canvas {
      background: #111;
      border: 3px solid white;
      display: block;
      margin: 0 auto;
    }

    /* 조작 안내 문구와 캔버스 사이에 여백을 둡니다. */
    p {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 화면에 표시되는 게임 제목입니다. -->
  <h1>블록 피하기</h1>

  <!-- 플레이어와 장애물을 그릴 500×600 크기의 게임 화면입니다. -->
  <canvas id="gameCanvas" width="500" height="600"></canvas>

  <!-- 사용자에게 키보드 조작법을 안내합니다. -->
  <p>← → 방향키로 이동하세요.</p>

  <script>
    // HTML의 캔버스를 가져오고, 2D 그림을 그릴 도구를 준비합니다.
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 장애물의 기본 속도와 시간이 흐른 뒤 추가될 최대 속도입니다.
    // 속도의 단위는 초당 이동하는 픽셀(px/s)입니다.
    const OBSTACLE_MIN_SPEED = 100;
    const OBSTACLE_MAX_SPEED = 160;
    const MAX_SPEED_BONUS = 160;

    // 장애물 생성 간격은 700ms에서 시작해 최대 난이도에서 280ms까지 줄어듭니다.
    const INITIAL_OBSTACLE_INTERVAL = 700;
    const MIN_OBSTACLE_INTERVAL = 280;

    // 게임 시작 60초 후 최고 난이도에 도달합니다.
    const MAX_DIFFICULTY_TIME = 60;

    // 플레이어의 위치, 크기, 좌우 이동 속도를 하나의 객체로 관리합니다.
    const player = {
      x: 220,
      y: 540,
      width: 60,
      height: 30,
      speed: 420
    };

    // 게임 진행 중 계속 변하는 상태값입니다.
    let obstacles = [];       // 현재 화면에 존재하는 장애물 목록
    let leftPressed = false;
    let rightPressed = false;
    let score = 0;            // 화면에 표시할 점수
    let elapsedTime = 0;      // 게임 시작 후 흐른 시간(초)
    let gameOver = false;     // 충돌하여 게임이 끝났는지 여부

    // 경과 시간을 0~1 사이 값으로 바꿉니다. 60초가 지나면 항상 1입니다.
    function getDifficultyProgress() {
      return Math.min(elapsedTime / MAX_DIFFICULTY_TIME, 1);
    }

    // 난이도가 높아질수록 장애물 생성 간격을 선형으로 줄입니다.
    function getObstacleInterval() {
      const progress = getDifficultyProgress();

      return INITIAL_OBSTACLE_INTERVAL -
        (INITIAL_OBSTACLE_INTERVAL - MIN_OBSTACLE_INTERVAL) * progress;
    }

    // 키를 누르면 해당 방향의 이동 상태를 켭니다.
    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowLeft") {
        leftPressed = true;
      }

      if (event.key === "ArrowRight") {
        rightPressed = true;
      }

      // 게임 종료 상태에서 스페이스바를 누르면 새 게임을 시작합니다.
      if (event.key === " " && gameOver) {
        restartGame();
      }
    });

    // 키를 떼면 해당 방향으로의 이동을 멈춥니다.
    document.addEventListener("keyup", function(event) {
      if (event.key === "ArrowLeft") {
        leftPressed = false;
      }

      if (event.key === "ArrowRight") {
        rightPressed = false;
      }
    });

    // 무작위 너비, 위치, 속도를 가진 새 장애물을 화면 위쪽에 만듭니다.
    function createObstacle() {
      const width = 40 + Math.random() * 50;
      // 시간이 흐를수록 모든 장애물에 추가 속도가 붙습니다.
      const speedBonus = MAX_SPEED_BONUS * getDifficultyProgress();

      obstacles.push({
        x: Math.random() * (canvas.width - width),
        y: -30,
        width: width,
        height: 30,
        speed: OBSTACLE_MIN_SPEED +
          Math.random() * (OBSTACLE_MAX_SPEED - OBSTACLE_MIN_SPEED) +
          speedBonus
      });
    }

    // 눌린 방향키에 따라 플레이어를 이동합니다.
    // deltaTime을 곱해 모니터 주사율과 관계없이 같은 속도를 유지합니다.
    function movePlayer(deltaTime) {
      if (leftPressed) {
        player.x -= player.speed * deltaTime;
      }

      if (rightPressed) {
        player.x += player.speed * deltaTime;
      }

      // 플레이어가 캔버스의 왼쪽과 오른쪽 경계를 벗어나지 않게 합니다.
      if (player.x < 0) {
        player.x = 0;
      }

      if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
      }
    }

    // 모든 장애물을 아래로 이동시키고 화면 밖으로 나간 장애물을 제거합니다.
    function moveObstacles(deltaTime) {
      for (let obstacle of obstacles) {
        obstacle.y += obstacle.speed * deltaTime;
      }

      obstacles = obstacles.filter(function(obstacle) {
        return obstacle.y < canvas.height;
      });
    }

    // 플레이어와 각 장애물의 사각형 영역이 겹치는지 검사합니다.
    function checkCollision() {
      for (let obstacle of obstacles) {
        // 좌우와 상하 영역이 모두 겹치면 충돌한 것입니다.
        const hit =
          player.x < obstacle.x + obstacle.width &&
          player.x + player.width > obstacle.x &&
          player.y < obstacle.y + obstacle.height &&
          player.y + player.height > obstacle.y;

        if (hit) {
          gameOver = true;
        }
      }
    }

    // 플레이어를 하늘색 사각형으로 그립니다.
    function drawPlayer() {
      ctx.fillStyle = "deepskyblue";
      ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
      );
    }

    // 현재 존재하는 모든 장애물을 빨간색 사각형으로 그립니다.
    function drawObstacles() {
      ctx.fillStyle = "tomato";

      for (let obstacle of obstacles) {
        ctx.fillRect(
          obstacle.x,
          obstacle.y,
          obstacle.width,
          obstacle.height
        );
      }
    }

    // 소수점 이하는 버리고 현재 점수를 왼쪽 위에 표시합니다.
    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "24px sans-serif";
      ctx.fillText("Score: " + Math.floor(score), 20, 35);
    }

    // 충돌했을 때 게임 종료 문구와 재시작 방법을 화면 중앙에 표시합니다.
    function drawGameOver() {
      ctx.fillStyle = "white";
      ctx.font = "40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.font = "20px sans-serif";
      ctx.fillText(
        "스페이스바를 눌러 다시 시작",
        canvas.width / 2,
        canvas.height / 2 + 50
      );

      // 다음 그리기에 영향을 주지 않도록 글자 정렬을 기본값으로 되돌립니다.
      ctx.textAlign = "left";
    }

    // 플레이어 위치와 모든 진행 상태를 처음 값으로 되돌립니다.
    function restartGame() {
      player.x = 220;
      obstacles = [];
      score = 0;
      elapsedTime = 0;
      gameOver = false;
      obstacleTimer = 0;
    }

    let obstacleTimer = 0;                 // 마지막 장애물 생성 후 지난 시간(ms)
    let lastFrameTime = performance.now(); // 직전 프레임이 실행된 시각

    // 매 프레임마다 상태를 갱신하고 게임 화면을 다시 그립니다.
    function gameLoop(currentTime) {
      // 프레임 사이의 경과 시간을 초 단위로 구합니다.
      // 탭을 오래 벗어났다가 돌아와도 한 번에 0.05초 이상 진행하지 않습니다.
      const deltaTime = Math.min((currentTime - lastFrameTime) / 1000, 0.05);
      lastFrameTime = currentTime;

      // 이전 프레임에 그린 내용을 모두 지웁니다.
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 게임이 진행 중일 때만 위치, 난이도, 충돌과 점수를 갱신합니다.
      if (!gameOver) {
        movePlayer(deltaTime);

        elapsedTime += deltaTime;
        obstacleTimer += deltaTime * 1000;

        // 현재 난이도에 맞는 간격마다 새 장애물을 생성합니다.
        const obstacleInterval = getObstacleInterval();

        if (obstacleTimer >= obstacleInterval) {
          createObstacle();
          obstacleTimer -= obstacleInterval;
        }

        moveObstacles(deltaTime);
        checkCollision();

        // 생존 시간에 비례해 초당 3점씩 얻습니다.
        score += deltaTime * 3;
      }

      // 갱신된 상태를 캔버스에 그립니다.
      drawPlayer();
      drawObstacles();
      drawScore();

      if (gameOver) {
        drawGameOver();
      }

      // 브라우저가 다음 화면을 그릴 준비가 되면 gameLoop를 다시 실행합니다.
      requestAnimationFrame(gameLoop);
    }

    // 첫 번째 게임 프레임을 요청하여 게임을 시작합니다.
    requestAnimationFrame(gameLoop);
  </script>

</body>
</html>
